<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول | مكتبة مينا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .auth-body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--grad-hero);
    background-size: 200% 200%;
    animation: heroDrift 18s ease-in-out infinite;
    padding: 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 40px 32px;
    box-shadow: var(--shadow-lg);
  }
  .auth-logo { text-align: center; font-size: 22px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
  .auth-logo span { color: var(--violet); }
  .auth-sub { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
  .auth-switch a { color: var(--violet-dark); font-weight: 700; }
</style>
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="auth-logo">📚 مكتبة <span>مينا</span></div>
  <p class="auth-sub">سجّل الدخول لمتابعة طلباتك بسهولة</p>

  <form id="loginForm">
    <div class="form-row">
      <label for="loginEmail">البريد الإلكتروني</label>
<input type="email" id="loginEmail" name="email" placeholder="أدخل البريد الإلكتروني">
    </div>
    <div class="form-row">
     <label for="loginPassword">كلمة المرور</label>
<input type="password" id="loginPassword" name="password" placeholder="أدخل كلمة المرور">
    </div>

    <div id="loginMessage" class="status-box error u-hidden"></div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">تسجيل الدخول</button>
  </form>

  <p class="auth-switch">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
  <p class="auth-switch"><a href="index.html">← العودة للمتجر</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
async function checkExistingSession() {
  const { data } = await window.supabaseClient.auth.getSession();
  if (data?.session) {
    window.location.href = "account.html";
  }
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginBtn");
  const messageBox = document.getElementById("loginMessage");

  messageBox.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> جاري تسجيل الدخول...`;

  try {
    const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    window.location.href = "account.html";
  } catch (err) {
    messageBox.style.display = "block";
    messageBox.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة";
    btn.disabled = false;
    btn.textContent = "تسجيل الدخول";
  }
});

checkExistingSession();
</script>
</body>
</html>
