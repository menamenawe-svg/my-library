<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إنشاء حساب جديد | MMK Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .auth-body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--grad-hero);
    background-size: 200% 200%;
    animation: heroDrift 18s ease-in-out infinite;
    padding: 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 460px;
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 40px 32px;
    box-shadow: var(--shadow-lg);
  }
  .auth-logo { text-align: center; font-size: 22px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
  .auth-logo span { color: var(--violet); }
  .auth-sub { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
  .auth-switch a { color: var(--violet-dark); font-weight: 700; }
</style>
</head>
<body class="auth-body">

<div class="auth-card">
<div class="auth-logo">📚 <span>MMK Store</span></div>
  <p class="auth-sub">أنشئ حسابك لمتابعة طلباتك وتسريع عملية الشراء</p>

  <form id="registerForm">
    <div class="form-row">
      <label for="regName">الاسم بالكامل <span class="req">*</span></label>
      <input type="text" id="regName" required>
    </div>
    <div class="form-row">
      <label for="regPhone">رقم الهاتف <span class="req">*</span></label>
      <input type="tel" id="regPhone" maxlength="11" required>
    </div>
    <div class="form-row">
      <label for="regEmail">البريد الإلكتروني <span class="req">*</span></label>
      <input type="email" id="regEmail" required autocomplete="username">
    </div>
    <div class="form-grid-2">
      <div class="form-row">
        <label for="regPassword">كلمة المرور <span class="req">*</span></label>
        <input type="password" id="regPassword" minlength="6" required autocomplete="new-password">
      </div>
      <div class="form-row">
        <label for="regPasswordConfirm">تأكيد كلمة المرور <span class="req">*</span></label>
        <input type="password" id="regPasswordConfirm" minlength="6" required autocomplete="new-password">
      </div>
    </div>

    <div id="registerMessage" class="status-box error u-hidden"></div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">إنشاء الحساب</button>
  </form>

  <p class="auth-switch">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
  <p class="auth-switch"><a href="index.html">← العودة للمتجر</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
function validateEgyptianPhoneLocal(phone) {
  return /^01[0125][0-9]{8}$/.test(String(phone).trim());
}

document.getElementById("regPhone").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 11);
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;
  const passwordConfirm = document.getElementById("regPasswordConfirm").value;

  const btn = document.getElementById("registerBtn");
  const messageBox = document.getElementById("registerMessage");
  messageBox.style.display = "none";

  if (!validateEgyptianPhoneLocal(phone)) {
    messageBox.style.display = "block";
    messageBox.textContent = "رقم الهاتف غير صحيح، الرجاء إدخال رقم مصري صحيح";
    return;
  }

  if (password !== passwordConfirm) {
    messageBox.style.display = "block";
    messageBox.textContent = "كلمتا المرور غير متطابقتين";
    return;
  }

  if (password.length < 6) {
    messageBox.style.display = "block";
    messageBox.textContent = "كلمة المرور يجب ألا تقل عن 6 أحرف";
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> جاري إنشاء الحساب...`;

  try {
    const { data, error } = await window.supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: name, phone: phone },
      },
    });

    if (error) throw error;

    if (data?.session) {
      window.location.href = "account.html";
    } else {
      messageBox.style.display = "block";
      messageBox.className = "status-box success";
      messageBox.textContent = "تم إنشاء الحساب بنجاح! تحقق من بريدك الإلكتروني لتفعيل الحساب ثم سجل الدخول.";
      btn.disabled = false;
      btn.textContent = "إنشاء الحساب";
    }
  } catch (err) {
    console.error("خطأ في إنشاء الحساب:", err);
    messageBox.style.display = "block";
    messageBox.className = "status-box error";
    messageBox.textContent = err.message && err.message.includes("already registered")
      ? "هذا البريد الإلكتروني مسجل بالفعل"
      : "حدث خطأ أثناء إنشاء الحساب، حاول مرة أخرى";
    btn.disabled = false;
    btn.textContent = "إنشاء الحساب";
  }
});
</script>
</body>
</html>
