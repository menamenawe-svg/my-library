<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول | لوحة تحكم مكتبة مينا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">📚 مكتبة <span>مينا</span></div>
    <p class="login-sub">لوحة تحكم الإدارة</p>

    <form id="loginForm">
      <div class="form-row">
       <label for="adminEmail">البريد الإلكتروني</label>
<input
  type="email"
  id="adminEmail"
  required
  autocomplete="username"
  placeholder="أدخل البريد الإلكتروني"
>
      </div>
      <div class="form-row">
      <label for="adminPassword">كلمة المرور</label>
<input
  type="password"
  id="adminPassword"
  required
  autocomplete="current-password"
  placeholder="أدخل كلمة المرور"
>
      </div>

 <div id="loginMessage" class="status-box error admin-login-message"></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">تسجيل الدخول</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script>
async function checkExistingSession() {
  const { data } = await window.supabaseClient.auth.getSession();
  if (data?.session) {
    window.location.href = "admin.html";
  }
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;
  const btn = document.getElementById("loginBtn");
  const messageBox = document.getElementById("loginMessage");

  messageBox.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> جاري تسجيل الدخول...`;

  try {
    const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    window.location.href = "admin.html";
  } catch (err) {
    messageBox.style.display = "block";
    messageBox.textContent = "بيانات الدخول غير صحيحة، حاول مرة أخرى";
    btn.disabled = false;
    btn.textContent = "تسجيل الدخول";
  }
});

checkExistingSession();
</script>
</body>
</html>
